<!doctype html>
<html lang="{{langue}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{bib_titre}}</title>
<meta name="description" content="{{description}}">
<link rel="alternate" hreflang="fr" href="{{base}}fr/bibliotheque/">
<link rel="alternate" hreflang="en" href="{{base}}en/bibliotheque/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="{{base}}assets/bibliotheque.css">
<link rel="stylesheet" href="{{base}}assets/compte.css">
</head>
<body>
<header>
  <div class="barre">
    <a class="logo" href="{{base}}{{langue}}/">ARTEFACTS<i>_</i></a>
    <label class="recherche">
      <span aria-hidden="true">❯</span>
      <span class="sr">{{bib_chercher}}</span>
      <input id="recherche" type="search" autocomplete="off" spellcheck="false" placeholder="{{bib_exemple}}">
      <kbd>/</kbd>
    </label>
    <nav>
      <a href="{{base}}{{langue}}/bibliotheque/" aria-current="page">{{bib_nav_biblio}}</a>
      <a href="{{base}}{{langue}}/ia/">{{nav_ia}}</a>
      <a href="https://github.com/Naod6473/artefacts-fx" class="github" aria-label="{{bib_etoile}}">★ GitHub <span id="etoiles"></span></a>
      <button type="button" id="btn-compte" class="btn-compte" aria-haspopup="dialog">{{cpt_se_connecter}}</button>
      <a href="{{base}}{{langue_autre_code}}/bibliotheque/" hreflang="{{langue_autre_code}}" lang="{{langue_autre_code}}">{{langue_autre}}</a>
    </nav>
  </div>
  <div class="barre rendus"><span class="dim">{{bib_rendu}}</span><div id="rendus" role="group" aria-label="{{bib_rendu}}"></div><span class="dim touche"><kbd>/</kbd> {{bib_aide_chercher}} <kbd>R</kbd> {{bib_aide_rendu}} <kbd>←</kbd><kbd>→</kbd> {{bib_aide_effet}} <kbd>F</kbd> {{bib_aide_favori}}</span></div>
</header>

<div class="corps">
  <main>
    <div class="entete">
      <div class="vues" role="group" aria-label="{{bib_vue}}">
        <button type="button" data-vue="tout">{{bib_tout}}</button>
        <button type="button" data-vue="favoris">♥ {{bib_favoris}} <span id="nb-favoris"></span></button>
        <button type="button" data-vue="projet">▤ {{bib_projet}} <span id="nb-projet"></span></button>
      </div>
      <div class="droite">
        <span id="compte" class="dim"></span>
        <label class="dim">{{bib_tri}} <select id="tri"><option value="numero">{{bib_tri_numero}}</option><option value="recent">{{bib_tri_recent}}</option><option value="nom">{{bib_tri_nom}}</option><option value="duree">{{bib_tri_duree}}</option></select></label>
      </div>
    </div>
    <div id="projets" class="projets" hidden>
      <label class="dim">{{cpt_projet_actif}} <select id="projet-actif"></select></label>
      <button type="button" id="projet-nouveau">{{cpt_projet_nouveau}}</button>
      <button type="button" id="projet-renommer">{{cpt_projet_renommer}}</button>
      <button type="button" id="projet-supprimer">{{cpt_projet_supprimer}}</button>
    </div>
    <div id="tags" class="tags"></div>
    <p id="vide" class="dim" hidden>{{bib_vide}}</p>
    <div id="mur"></div>
  </main>

  <aside aria-label="{{bib_panneau}}">
    <div class="titre">
      <div><span id="fx-num" class="num"></span><h1 id="fx-nom"></h1></div>
      <div class="boutons">
        <button type="button" id="lien" aria-label="{{bib_lien}}" title="{{bib_lien}}">⧉</button>
        <button type="button" id="fx-coeur" class="coeur" aria-label="{{bib_favori}}" title="{{bib_favori}} (F)">♥</button>
      </div>
    </div>
    <p id="fx-desc" class="dim"></p>
    <canvas id="apercu"></canvas>
    <div class="lecture">
      <button type="button" id="lecture">❚❚</button>
      <input id="curseur" type="range" min="0" max="1000" value="0" aria-label="{{bib_temps}}">
      <span id="temps" class="dim"></span>
      <label class="sr" for="vitesse">{{bib_vitesse}}</label>
      <select id="vitesse"><option value="0.25">×¼</option><option value="0.5">×½</option><option value="1" selected>×1</option><option value="2">×2</option></select>
    </div>
    <div id="comparaison">
      <figure><canvas></canvas><figcaption></figcaption></figure>
      <figure><canvas></canvas><figcaption></figcaption></figure>
      <figure><canvas></canvas><figcaption></figcaption></figure>
      <figure><canvas></canvas><figcaption></figcaption></figure>
    </div>
    <div class="projet">
      <button type="button" id="fx-projet"></button>
      <label id="note" hidden><span class="sr">{{bib_note}}</span><input id="fx-note" type="text" maxlength="200" placeholder="{{bib_note}}"></label>
    </div>
    <div id="fx-tags" class="tags"></div>
    <div role="tablist" class="onglets">
      <button type="button" role="tab" data-onglet="usage">{{bib_utiliser}}</button>
      <button type="button" role="tab" data-onglet="source">{{bib_source}}</button>
    </div>
    <pre id="code" tabindex="0"></pre>
    <div class="actions">
      <button type="button" id="copier" class="principal">{{bib_copier}}</button>
      <button type="button" id="video">{{bib_video}}</button>
      <button type="button" disabled title="{{bib_bientot}}">Godot</button>
    </div>
    <p id="fx-infos" class="dim petit"></p>
  </aside>
</div>
{{> compte}}
<script id="textes" type="application/json">{"lire":"{{bib_lire}}","pause":"{{bib_pause}}","copie":"{{bib_copie}}","copie_ko":"{{bib_copie_ko}}","video_ko":"{{bib_video_ko}}","video_ok":"{{bib_video_ok}}","video_en_cours":"{{bib_video_en_cours}}","virgule":"{{bib_virgule}}","favori":"{{bib_favori}}","vide":"{{bib_vide}}","vide_favoris":"{{bib_vide_favoris}}","vide_projet":"{{bib_vide_projet}}","ajouter_projet":"{{bib_ajouter_projet}}","retirer_projet":"{{bib_retirer_projet}}","lien_copie":"{{bib_lien_copie}}","base":"{{base}}","se_connecter":"{{cpt_se_connecter}}","creer_titre":"{{cpt_creer_titre}}","connexion_titre":"{{cpt_connexion_titre}}","oubli_titre":"{{cpt_oubli_titre}}","nouveau_titre":"{{cpt_nouveau_titre}}","creer_bouton":"{{cpt_creer_bouton}}","oubli_bouton":"{{cpt_oubli_bouton}}","nouveau_bouton":"{{cpt_nouveau_bouton}}","nouveau_mdp":"{{cpt_nouveau_mdp}}","mdp":"{{cpt_mdp}}","envoye_confirmer":"{{cpt_envoye_confirmer}}","envoye_oubli":"{{cpt_envoye_oubli}}","bienvenue":"{{cpt_bienvenue}}","deconnecte":"{{cpt_deconnecte}}","supprimer_confirmer":"{{cpt_supprimer_confirmer}}","supprimer_mdp":"{{cpt_supprimer_mdp}}","supprime":"{{cpt_supprime}}","projet_nom":"{{cpt_projet_nom}}","projet_defaut":"{{cpt_projet_defaut}}","projet_brouillon":"{{cpt_projet_brouillon}}","projet_suppr_confirmer":"{{cpt_projet_suppr_confirmer}}","hors_ligne":"{{cpt_hors_ligne}}","sync_ko":"{{cpt_sync_ko}}"}</script>
<script type="module" src="{{base}}assets/bibliotheque.js"></script>
</body>
</html>
