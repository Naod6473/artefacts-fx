# Construit le site et l'envoie sur l'hébergement OVH en SFTP à chaque push sur main.
# Réglages : config/ovh.json. Identifiants : secrets du repo FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (Settings > Secrets and variables > Actions). Sans ces secrets, le site est construit mais pas envoyé.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  construire-et-envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Réglages secrets de l'API (connexion GitHub, envoi des e-mails)
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          # écrits dans api/donnees/, que le serveur ne sert jamais ; absents du repo
          [ -n "$GH_CLIENT_ID" ] || echo "::warning::Secret GH_CLIENT_ID absent : connexion GitHub désactivée."
          [ -n "$BREVO_API_KEY$SMTP_PASSWORD" ] || echo "::warning::Secrets BREVO_API_KEY et SMTP_PASSWORD absents : e-mails envoyés par mail() de l'hébergement."
          php -r 'file_put_contents("dist/api/donnees/config.php", "<?php return " . var_export(["github_id" => getenv("GH_CLIENT_ID"), "github_secret" => getenv("GH_CLIENT_SECRET"), "smtp_mdp" => getenv("SMTP_PASSWORD"), "brevo_cle" => getenv("BREVO_API_KEY")], true) . ";\n");'
      - name: Lire config/ovh.json
        id: config
        run: |
          echo "dossier=$(jq -r .dossier_distant config/ovh.json)" >> "$GITHUB_OUTPUT"
          echo "port=$(jq -r .port config/ovh.json)" >> "$GITHUB_OUTPUT"
      - name: Envoyer sur OVH (SFTP)
        if: env.FTP_SERVER != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DOSSIER: ${{ steps.config.outputs.dossier }}
          PORT: ${{ steps.config.outputs.port }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$FTP_SERVER" >> ~/.ssh/known_hosts 2> /dev/null
          ssh-keygen -lf ~/.ssh/known_hosts
          # mirror -R envoie dist/ ; sans --delete, rien n'est effacé sur le serveur,
          # et les données de la communauté (api/donnees/*.sqlite, *.json) ne sont jamais écrasées
          lftp -c "set net:max-retries 2; set net:timeout 30;
            open -p $PORT -u $FTP_USERNAME --env-password sftp://$FTP_SERVER;
            mirror -R --verbose --parallel=4 -x '^api/donnees/.*\.(sqlite|sqlite-journal|json)$' dist/ $DOSSIER"
      - name: Vérifier le site en ligne
        if: env.FTP_SERVER != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          base="https://$(jq -r .domaine config/ovh.json)$(jq -r .chemin_web config/ovh.json)"
          for p in fr/ en/ assets/accueil.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base$p"); echo "$base$p -> $code"
            [ "$code" = 200 ] || exit 1
          done
          echo "racine (fr) -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Accept-Language: fr' "$base")"
          echo "api/ -> $(curl -s "${base}api/")"
          echo "api/donnees/test.sqlite -> $(curl -s -o /dev/null -w '%{http_code}' "${base}api/donnees/test.sqlite") (403 ou 404 attendu)"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${base}api/donnees/config.php"); echo "api/donnees/config.php -> $code"
          [ "$code" = 403 ] || [ "$code" = 404 ] || exit 1
          echo "::notice::api/compte/moi -> $(curl -s "${base}api/compte/moi")"
          echo "::notice::api/compte/inscription (e-mail invalide, 400 attendu) -> $(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -H "Origin: ${base%/}" -d '{"email":"x","mdp":"12345678"}' "${base}api/compte/inscription")"
      - name: Journal des erreurs de l'API
        if: env.FTP_SERVER != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DOSSIER: ${{ steps.config.outputs.dossier }}
          PORT: ${{ steps.config.outputs.port }}
        run: |
          # les 20 dernières erreurs PHP des comptes (api/donnees/erreurs.log), affichées en avertissements du déploiement
          journal=$(lftp -c "open -p $PORT -u $FTP_USERNAME --env-password sftp://$FTP_SERVER; cat ${DOSSIER}api/donnees/erreurs.log" 2>&1 || true)
          echo "$journal" | tail -20 | sed 's/^/::warning::journal : /'
      - name: Secrets absents
        if: env.FTP_SERVER == ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: echo "::warning::Secrets FTP absents, le site est construit mais pas envoyé."
